<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Bot & Ticket Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            discord: '#5865F2',
            darkBg: '#0f1117',
            cardBg: '#181b24',
            borderClr: '#282c37',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-darkBg text-slate-200 min-h-screen font-sans">

  <!-- Top Navbar -->
  <header class="border-b border-borderClr bg-cardBg px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-full bg-discord flex items-center justify-center text-white text-lg">
        <i class="fa-brands fa-discord"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold text-white">Bot Management Dashboard</h1>
        <p class="text-xs text-slate-400">Tickets, Panels & Controls</p>
      </div>
    </div>

    <!-- Discord OAuth2 User Profile Section -->
    <div id="authContainer" class="flex items-center space-x-4">
      <button id="discordLoginBtn" onclick="initiateDiscordLogin()" class="bg-discord hover:bg-indigo-600 transition text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 shadow-lg shadow-indigo-500/20">
        <i class="fa-brands fa-discord text-base"></i> Login with Discord
      </button>
      <div id="userInfo" class="hidden flex items-center space-x-3 bg-[#111319] border border-borderClr px-3 py-1.5 rounded-xl">
        <img id="userAvatar" class="w-8 h-8 rounded-full border border-discord object-cover" src="" alt="Avatar" />
        <div class="leading-tight">
          <div id="userName" class="text-sm font-semibold text-white"></div>
          <div id="userId" class="text-[10px] text-slate-400 font-mono"></div>
        </div>
        <button onclick="logoutDiscord()" title="Logout" class="ml-2 text-slate-400 hover:text-rose-400 transition text-sm">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-6">

    <!-- Configuration Bar -->
    <section class="bg-cardBg border border-borderClr p-5 rounded-xl space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-discord"></i> Dashboard Configuration
        </h2>
        <span class="text-xs text-slate-500">Auto-saved in browser</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">
            Discord Client ID <span class="text-slate-500">(For OAuth)</span>
          </label>
          <input id="discordClientId" type="text" placeholder="e.g. 123456789012345678" onchange="saveConfig()" class="w-full bg-[#111319] border border-borderClr rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-discord" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">
            Railway API URL <span class="text-slate-500">(Bot Host)</span>
          </label>
          <input id="apiUrl" type="text" placeholder="https://your-bot.up.railway.app" onchange="saveConfig()" class="w-full bg-[#111319] border border-borderClr rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-discord" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">
            Bot Secret Key <span class="text-slate-500">(BOT_API_KEY)</span>
          </label>
          <input id="apiKey" type="password" placeholder="Your BOT_API_KEY" onchange="saveConfig()" class="w-full bg-[#111319] border border-borderClr rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-discord" />
        </div>
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-borderClr/50">
        <div id="connectionStatus" class="text-xs text-slate-400 flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-slate-500"></span> Disconnected
        </div>
        <button onclick="testConnection()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg text-xs transition flex items-center gap-2">
          <i class="fa-solid fa-plug"></i> Test Connection & Sync
        </button>
      </div>
    </section>

    <!-- Main Dashboard Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <!-- Deploy Ticket Panel Card -->
      <section class="bg-cardBg border border-borderClr p-5 rounded-xl space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="font-semibold text-white flex items-center gap-2">
            <i class="fa-solid fa-ticket text-indigo-400"></i> Deploy Ticket Panel
          </h2>
          <span class="text-[11px] bg-indigo-900/40 text-indigo-300 px-2 py-0.5 rounded font-mono">Action</span>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Target Discord Channel ID</label>
          <input id="panelChannelId" type="text" placeholder="Right-click channel in Discord -> Copy Channel ID" class="w-full bg-[#111319] border border-borderClr rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-discord" />
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Embed Title</label>
          <input id="panelTitle" type="text" value="📩 Support & Help Tickets" class="w-full bg-[#111319] border border-borderClr rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-discord" />
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Embed Description</label>
          <textarea id="panelDesc" rows="3" class="w-full bg-[#111319] border border-borderClr rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-discord">Click the button below to open a private ticket with our staff team.</textarea>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Button Label</label>
          <input id="panelButtonLabel" type="text" value="Open Ticket" class="w-full bg-[#111319] border border-borderClr rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-discord" />
        </div>

        <button onclick="deployPanel()" class="w-full bg-discord hover:bg-indigo-600 font-medium text-white py-2.5 rounded-lg text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/10">
          <i class="fa-solid fa-paper-plane"></i> Deploy Panel to Channel
        </button>
        <p id="panelResult" class="text-xs text-center text-slate-400"></p>
      </section>

      <!-- Active Tickets List -->
      <section class="bg-cardBg border border-borderClr p-5 rounded-xl flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-4">
            <h2 class="font-semibold text-white flex items-center gap-2">
              <i class="fa-solid fa-inbox text-amber-400"></i> Active Tickets
            </h2>
            <button onclick="loadTickets()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 transition">
              <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
          </div>

          <div id="ticketsList" class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
            <p class="text-xs text-slate-500 italic">Connect to the Bot API to load active tickets.</p>
          </div>
        </div>

        <!-- Ticket Quick Action Box -->
        <div id="ticketActionBox" class="hidden mt-4 pt-4 border-t border-borderClr space-y-3 bg-[#111319] p-3 rounded-lg">
          <div class="flex items-center justify-between">
            <h3 id="selectedTicketName" class="text-xs font-bold text-white"></h3>
            <span class="text-[10px] text-slate-400">Replying as: <span id="replyingUser" class="text-discord font-medium">Web</span></span>
          </div>
          <div class="flex gap-2">
            <input id="ticketReplyMsg" type="text" placeholder="Type a message to send into ticket channel..." class="flex-1 bg-darkBg border border-borderClr rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-discord" />
            <button onclick="sendTicketReply()" class="bg-discord hover:bg-indigo-600 px-3 py-1.5 rounded-lg text-xs font-medium text-white">Reply</button>
            <button onclick="closeSelectedTicket()" class="bg-rose-600 hover:bg-rose-500 px-3 py-1.5 rounded-lg text-xs font-medium text-white">Close</button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script>
    const KEY_CLIENT_ID = 'discord_client_id';
    const KEY_API_URL = 'discord_bot_api_url';
    const KEY_API_KEY = 'discord_bot_api_key';
    const KEY_USER = 'discord_user_session';

    let currentSelectedTicketId = null;

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('discordClientId').value = localStorage.getItem(KEY_CLIENT_ID) || '';
      document.getElementById('apiUrl').value = localStorage.getItem(KEY_API_URL) || '';
      document.getElementById('apiKey').value = localStorage.getItem(KEY_API_KEY) || '';

      handleOAuthCallback();
      restoreUserSession();

      if (document.getElementById('apiUrl').value && document.getElementById('apiKey').value) {
        testConnection();
      }
    });

    function saveConfig() {
      localStorage.setItem(KEY_CLIENT_ID, document.getElementById('discordClientId').value.trim());
      localStorage.setItem(KEY_API_URL, document.getElementById('apiUrl').value.trim().replace(/\/$/, ''));
      localStorage.setItem(KEY_API_KEY, document.getElementById('apiKey').value.trim());
    }

    function initiateDiscordLogin() {
      saveConfig();
      const clientId = localStorage.getItem(KEY_CLIENT_ID);

      if (!clientId) {
        alert('Please enter your Discord Client ID in the configuration bar first.');
        document.getElementById('discordClientId').focus();
        return;
      }

      // Generate CSRF token
      const array = new Uint8Array(16);
      crypto.getRandomValues(array);
      const state = Array.from(array, b => b.toString(16).padStart(2, '0')).join('');
      sessionStorage.setItem('discord_oauth_state', state);

      const redirectUri = window.location.origin + window.location.pathname;
      const authUrl = `https://discord.com/oauth2/authorize?client_id=${clientId}&response_type=token&scope=identify&state=${state}&redirect_uri=${encodeURIComponent(redirectUri)}`;
      window.location.href = authUrl;
    }

    async function handleOAuthCallback() {
      if (!window.location.hash || !window.location.hash.includes('access_token')) return;

      const params = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = params.get('access_token');
      const returnedState = params.get('state');
      const savedState = sessionStorage.getItem('discord_oauth_state');

      // Verify CSRF state token
      if (!savedState || returnedState !== savedState) {
        console.error('State token mismatch. Potential CSRF prevented.');
        alert('Security warning: OAuth state mismatch. Login aborted.');
        window.history.replaceState({}, document.title, window.location.pathname);
        return;
      }

      sessionStorage.removeItem('discord_oauth_state');

      // Scrub token from URL hash for security
      window.history.replaceState({}, document.title, window.location.pathname + window.location.search);

      try {
        const res = await fetch('https://discord.com/api/v10/users/@me', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });

        if (!res.ok) throw new Error('Failed to fetch Discord profile');
        const user = await res.json();

        const avatarUrl = user.avatar
          ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
          : `https://cdn.discordapp.com/embed/avatars/${parseInt(user.discriminator || '0') % 5}.png`;

        const sessionData = {
          id: user.id,
          username: user.global_name || user.username,
          tag: user.username,
          avatar: avatarUrl,
        };

        localStorage.setItem(KEY_USER, JSON.stringify(sessionData));
        restoreUserSession();
      } catch (err) {
        console.error('OAuth profile fetch error:', err);
        alert('Could not retrieve Discord profile: ' + err.message);
      }
    }

    function restoreUserSession() {
      const user = JSON.parse(localStorage.getItem(KEY_USER) || 'null');
      if (user) {
        document.getElementById('discordLoginBtn').classList.add('hidden');
        document.getElementById('userInfo').classList.remove('hidden');
        document.getElementById('userName').textContent = user.username;
        document.getElementById('userId').textContent = `#${user.tag}`;
        document.getElementById('userAvatar').src = user.avatar;
        document.getElementById('replyingUser').textContent = user.username;
      } else {
        document.getElementById('discordLoginBtn').classList.remove('hidden');
        document.getElementById('userInfo').classList.add('hidden');
        document.getElementById('replyingUser').textContent = 'Web Staff';
      }
    }

    function logoutDiscord() {
      localStorage.removeItem(KEY_USER);
      restoreUserSession();
    }

    function getApiConfig() {
      saveConfig();
      return {
        url: localStorage.getItem(KEY_API_URL),
        key: localStorage.getItem(KEY_API_KEY)
      };
    }

    async function testConnection() {
      const { url, key } = getApiConfig();
      const statusEl = document.getElementById('connectionStatus');

      if (!url || !key) {
        statusEl.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Missing API URL or Secret Key.';
        return;
      }

      statusEl.innerHTML = '<span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span> Testing connection...';

      try {
        const res = await fetch(`${url}/api/status`, {
          headers: { 'X-API-Key': key }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status} - Invalid key or route`);
        const data = await res.json();

        statusEl.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Connected: <b>${data.tag}</b> | Ping: ${data.ping}ms | Servers: ${data.guilds}`;
        loadTickets();
      } catch (err) {
        statusEl.innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Connection failed: ${err.message}`;
      }
    }

    async function deployPanel() {
      const { url, key } = getApiConfig();
      const channelId = document.getElementById('panelChannelId').value.trim();
      const title = document.getElementById('panelTitle').value.trim();
      const description = document.getElementById('panelDesc').value.trim();
      const buttonLabel = document.getElementById('panelButtonLabel').value.trim();
      const resultEl = document.getElementById('panelResult');

      if (!channelId) {
        resultEl.innerHTML = '<span class="text-rose-400">Channel ID is required.</span>';
        return;
      }

      resultEl.innerHTML = '<span class="text-amber-400">Deploying panel to Discord...</span>';

      try {
        const res = await fetch(`${url}/api/ticket-panel`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-API-Key': key,
          },
          body: JSON.stringify({ channelId, title, description, buttonLabel })
        });
        const data = await res.json();
        if (data.success) {
          resultEl.innerHTML = `<span class="text-emerald-400 font-medium">✅ ${data.message}</span>`;
        } else {
          resultEl.innerHTML = `<span class="text-rose-400">❌ ${data.error}</span>`;
        }
      } catch (err) {
        resultEl.innerHTML = `<span class="text-rose-400">Error: ${err.message}</span>`;
      }
    }

    async function loadTickets() {
      const { url, key } = getApiConfig();
      const listEl = document.getElementById('ticketsList');

      try {
        const res = await fetch(`${url}/api/tickets`, {
          headers: { 'X-API-Key': key }
        });
        const data = await res.json();
        const tickets = data.tickets || [];

        if (tickets.length === 0) {
          listEl.innerHTML = '<p class="text-xs text-slate-500 italic">No active tickets right now.</p>';
          return;
        }

        listEl.innerHTML = tickets.map(t => `
          <div onclick="selectTicket('${t.id}', '${t.name}')" class="p-3 bg-[#111319] hover:border-discord border border-borderClr rounded-lg cursor-pointer flex items-center justify-between transition">
            <div>
              <div class="text-xs font-semibold text-white">#${t.name}</div>
              <div class="text-[10px] text-slate-500">${t.guildName} • ID: ${t.id}</div>
            </div>
            <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded">Active</span>
          </div>
        `).join('');
      } catch (err) {
        listEl.innerHTML = `<p class="text-xs text-rose-400">Failed to load tickets: ${err.message}</p>`;
      }
    }

    function selectTicket(id, name) {
      currentSelectedTicketId = id;
      document.getElementById('ticketActionBox').classList.remove('hidden');
      document.getElementById('selectedTicketName').textContent = `Managing #${name}`;
    }

    async function sendTicketReply() {
      const { url, key } = getApiConfig();
      const msg = document.getElementById('ticketReplyMsg').value.trim();
      const user = JSON.parse(localStorage.getItem(KEY_USER) || '{"username":"Web Staff"}');

      if (!msg || !currentSelectedTicketId) return;

      try {
        const res = await fetch(`${url}/api/tickets/${currentSelectedTicketId}/message`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-API-Key': key,
          },
          body: JSON.stringify({ message: msg, senderName: user.username })
        });
        if (!res.ok) throw new Error('Failed to send');
        document.getElementById('ticketReplyMsg').value = '';
        alert('Message posted in Discord ticket channel!');
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    async function closeSelectedTicket() {
      const { url, key } = getApiConfig();
      if (!currentSelectedTicketId || !confirm('Are you sure you want to close and delete this ticket channel?')) return;

      try {
        await fetch(`${url}/api/tickets/${currentSelectedTicketId}/close`, {
          method: 'POST',
          headers: { 'X-API-Key': key }
        });
        alert('Ticket closed!');
        document.getElementById('ticketActionBox').classList.add('hidden');
        loadTickets();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  </script>
</body>
</html>
